<div id="popupHeader">
    <input type="text" id="searchTabs" placeholder="🎄Merry Christmas ❆❆❆...">
    <button id="closePopup" title="Close (ESC)">🎅</button>
</div>

<div class="popup-main-container">
    <ul id="tabList"></ul>

    <div id="historySection">
        <div class="history-scrollable">
            <div class="stats-container">
                <div id="tabStats"></div>
            </div>

            <div class="bulk-actions-container">
                <div class="bulk-actions-buttons">
                    <button id="hideAllTabs">🌟 Hide All Visible</button>

                    <button id="showAllTabs">🎁 Show All Hidden</button>
                </div>
            </div>

            <div class="recent-searches-header">
                <span class="recent-searches-icon">❄️</span>
                <h3 class="recent-searches-title">Recent Searches</h3>
            </div>
            <div class="recent-searches-divider"></div>
            <ul id="historyList"></ul>
        </div>

        <div class="history-sticky-footer">
            <div class="sort-container">
                <select id="sortTabs">
                    <option value="default">☃️ Default Order</option>
                    <option value="alphabetical">🔤 Alphabetical</option>
                    <option value="color">🎨 By Color</option>
                    <option value="recent">⏰ Recently Used</option>
                </select>
            </div>
            <label class="toggle-container">
                <span class="toggle-label-text">
                    Hide/Show Button Show All Tabs
                </span>
                <label class="switch">
                    <input type="checkbox" id="toggleEagleXBtn" checked>
                    <span class="slider round"></span>
                </label>
            </label>
        </div>
    </div>
</div>
