<div id="snowfall" class="snowfall" aria-hidden="true"></div>

<div id="popupHeader">
    <input type="text" id="searchTabs" placeholder="Merry Christmas...⋆꙳•̩̩͙❅*̩̩͙‧͙ ‧͙*̩̩͙❆ ͙͛ ˚₊⋆🎄❄️☃️🦌">
    <button id="closePopup" title="Close (ESC)" aria-label="Close popup">🎁</button>
</div>

<div class="popup-main-container">
    <ul id="tabList"></ul>

    <div id="historySection">
        <div class="history-scrollable">
            <div class="stats-container">
                <div id="tabStats"></div>
            </div>

            <div class="bulk-actions-container">
                <div class="bulk-actions-buttons">
                    <button id="hideAllTabs">Hide Visible</button>

                    <button id="showAllTabs">Show Hidden</button>
                </div>
            </div>

            <div class="quick-filter-container" id="quickFilterContainer">
                <button class="quick-filter-btn active" data-filter="all">All</button>
                <button class="quick-filter-btn" data-filter="visible">Visible</button>
                <button class="quick-filter-btn" data-filter="hidden">Hidden</button>
                <button class="quick-filter-btn" data-filter="favorite">Favorite</button>
            </div>

            <div id="undoBar" class="undo-bar" aria-live="polite">
                <span id="undoMessage">Action completed</span>
                <button id="undoActionBtn" type="button">Undo</button>
            </div>

            <div class="recent-searches-header">
                <span class="recent-searches-icon">🎅</span>
                <h3 class="recent-searches-title">Recent Searches</h3>
            </div>
            <div class="recent-searches-divider"></div>
            <ul id="historyList"></ul>
        </div>

        <div class="history-sticky-footer">
            <div class="font-container">
                <select id="fontSizeMode" aria-label="Font size">
                    <option value="0.9">Font: Small (90%)</option>
                    <option value="1" selected>Font: Default (100%)</option>
                    <option value="1.1">Font: Medium (110%)</option>
                    <option value="1.2">Font: Large (120%)</option>
                    <option value="1.3">Font: XL (130%)</option>
                </select>
            </div>
            <div class="theme-container">
                <select id="themeMode" aria-label="Theme mode">
                    <option value="auto">Theme: Auto</option>
                    <option value="light">Theme: Light</option>
                    <option value="dark">Theme: Dark</option>
                </select>
            </div>
            <div class="sort-container">
                <select id="sortTabs">
                    <option value="default">Default Order</option>
                    <option value="alphabetical">Alphabetical</option>
                    <option value="color">By Color</option>
                    <option value="recent">Recently Used</option>
                </select>
            </div>
            <label class="toggle-container">
                <span class="toggle-label-text">
                    Show floating button
                </span>
                <span class="switch">
                    <input type="checkbox" id="toggleEagleXBtn" checked>
                    <span class="slider round"></span>
                </span>
            </label>
        </div>
    </div>
</div>
